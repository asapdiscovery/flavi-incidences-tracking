[project]
name = "dengue-us"
version = "0.1.0"
description = "Figures tracking reported dengue incidence in the United States from CDC ArboNET data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "matplotlib>=3.8", "geopandas>=1.0"]

[project.scripts]
dengue-us = "dengue_us.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
